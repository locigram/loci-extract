name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: arc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system tools (pdffonts from poppler-utils)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils
          pdffonts -v

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest -q

  docker-build:
    runs-on: arc
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No Dockerfile in this checkout; skipping image build and smoke test.'
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: steps.dockerfile.outputs.present == 'true'
        run: docker build -t loci-extract:ci .

      - name: Smoke test container
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          set -euo pipefail
          docker rm -f loci-extract-ci >/dev/null 2>&1 || true
          docker run -d --name loci-extract-ci -p 18000:8000 loci-extract:ci
          cleanup() {
            docker rm -f loci-extract-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Container did not become healthy in time.' >&2
          docker logs loci-extract-ci || true
          exit 1

name: secrets
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: "arc"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          chmod 0755 "$dir/gitleaks"
          args=""; if [ -f .gitleaks-baseline.json ]; then args="--baseline-path .gitleaks-baseline.json"; fi
          PATH="$dir:$PATH" gitleaks git --redact --no-banner --log-opts=HEAD $args .
